services:
  clock-firmware:
    image: nginx:1.28-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./releases:/srv/releases:ro
    networks: [proxy]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.snes-firmware.rule: Host(`git.local.weylandyutani.se`) && PathPrefix(`/clock-firmware/`)
      traefik.http.routers.snes-firmware.entrypoints: https
      traefik.http.routers.snes-firmware.tls: 'true'
      traefik.http.routers.snes-firmware.tls.certresolver: cloudflare
      traefik.http.services.snes-firmware.loadbalancer.server.port: '8080'
networks:
  proxy:
    external: true
