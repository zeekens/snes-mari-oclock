server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    auth_basic "Clock firmware";
    auth_basic_user_file /etc/nginx/htpasswd;
    location /clock-firmware/releases/ {
        alias /srv/releases/;
        autoindex off;
        limit_except GET { deny all; }
        add_header Cache-Control "private, no-store";
    }
    location / { return 404; }
}
