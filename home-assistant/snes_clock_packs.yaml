# Generated by scripts/generate-pack-ha.py. Review entity names for your installation.
input_select:
  snes_clock_face:
    name: SNES Clock Face
    options:
    - Mario
    - Luigi Forest
    - Cape Luigi Forest
    - Ghost House
    - Tide Pool
    - Lava Fortress
    - Star Road
    - Bonus Room
  snes_clock_pack_source:
    name: SNES Clock Pack Source
    options:
    - Home Assistant
    - GitHub
input_text:
  snes_clock_ha_pack_base:
    name: SNES Clock HA Library URL
    max: 255
  snes_clock_github_pack_base:
    name: SNES Clock GitHub Library URL
    max: 255
script:
  snes_clock_apply_face:
    alias: SNES Clock - Apply face
    mode: restart
    sequence:
    - variables:
        face: '{{ states(''input_select.snes_clock_face'') }}'
        catalog:
          Ghost House:
            id: ghost-house
            name: Ghost House
            engine: 1
            file: ghost-house-5153597b60d369d7.scn
            bytes: 1192
            sha256: 5153597b60d369d7eeeecfd9cef06b46e9d6750c8428a07f4eda017eb4762f5b
          Tide Pool:
            id: tide-pool
            name: Tide Pool
            engine: 2
            file: tide-pool-84e168bf9fd78164.scn
            bytes: 344
            sha256: 84e168bf9fd781643e59e33d713ee096ee7bdda41d728a2caad3f6e400387cae
          Lava Fortress:
            id: lava-fortress
            name: Lava Fortress
            engine: 3
            file: lava-fortress-be52d23e28717e59.scn
            bytes: 2840
            sha256: be52d23e28717e59da903348a49ff45fbb200691034a0434a99a8a2d8bddd2d4
          Star Road:
            id: star-road
            name: Star Road
            engine: 4
            file: star-road-258e165b3fe12bea.scn
            bytes: 324
            sha256: 258e165b3fe12beaf210b9b5490be6eeb3f15c123fc02d6fd18129e82b6439e0
          Bonus Room:
            id: bonus-room
            name: Bonus Room
            engine: 5
            file: bonus-room-4f1be26e2a384c86.scn
            bytes: 1484
            sha256: 4f1be26e2a384c8672588d50917662c1a414fb4aaa7b2a7664ce021b4e75e71a
        pack_base: '{{ states(''input_text.snes_clock_github_pack_base'') if is_state(''input_select.snes_clock_pack_source'',
          ''GitHub'') else states(''input_text.snes_clock_ha_pack_base'') }}'
    - choose:
      - conditions: '{{ face in [''Mario'', ''Luigi Forest'', ''Cape Luigi Forest'']
          }}'
        sequence:
        - action: esphome.snes_clock_use_builtin_scene
          data:
            scene_name: '{{ face }}'
      default:
      - if: '{{ face not in catalog or not pack_base.startswith((''http://'', ''https://''))
          }}'
        then:
        - stop: Select a valid scene and configure the pack library URL
          error: true
      - action: esphome.snes_clock_load_scene_pack
        data:
          pack_url: '{{ pack_base.rstrip(''/'') ~ ''/'' ~ catalog[face][''file'']
            }}'
          expected_hash: '{{ catalog[face][''sha256''] }}'
automation:
- id: snes_clock_apply_pack_selection
  alias: SNES Clock - Restore or change face
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - input_select.snes_clock_face
    - input_select.snes_clock_pack_source
    - input_text.snes_clock_ha_pack_base
    - input_text.snes_clock_github_pack_base
  - trigger: state
    entity_id: binary_sensor.snes_clock_status
    to: 'on'
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:03
  - condition: state
    entity_id: binary_sensor.snes_clock_status
    state: 'on'
  - action: script.snes_clock_apply_face
